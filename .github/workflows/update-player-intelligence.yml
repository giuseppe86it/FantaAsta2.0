name: Aggiorna Player Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"

permissions:
  contents: write

jobs:
  update-player-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache dati soccerdata
        uses: actions/cache@v4
        with:
          path: .cache/soccerdata
          key: soccerdata-seriea-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            soccerdata-seriea-${{ runner.os }}-

      - name: Installa Player Intelligence
        run: |
          python -m pip install --upgrade pip
          python -m pip install "soccerdata==1.9.1" pandas

      - name: Aggiorna statistiche storiche
        env:
          FA2_SEASON_START: "2026"
          FA2_PI_MIN_PLAYERS: "120"
        run: python scripts/update-player-intelligence.py

      - name: Salva il nuovo feed se è cambiato
        run: |
          if git diff --quiet -- player-intelligence.json; then
            echo "Nessun cambiamento nel feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-intelligence.json
          git commit -m "Aggiorna Player Intelligence"
          git push
