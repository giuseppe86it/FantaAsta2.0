name: Aggiorna Player Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"

permissions:
  contents: write

jobs:
  update-player-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna statistiche storiche
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FA2_PI_LEAGUE_ID: "135"
          FA2_PI_SEASONS: "2025,2024"
          FA2_PI_MIN_PLAYERS: "120"
          FA2_PI_MAX_REQUESTS: "90"
        run: python scripts/update-player-intelligence.py

      - name: Salva il nuovo feed se è cambiato
        run: |
          if git diff --quiet -- player-intelligence.json; then
            echo "Nessun cambiamento nel feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-intelligence.json
          git commit -m "Aggiorna Player Intelligence API-Football"
          git push
